name: Task reminder cron

# 服务端 Web Push 提醒链路（/api/cron/task-reminders + sw.js push handler）
# 依赖外部定时触发：客户端 setTimeout 在标签页后台会被浏览器节流，
# 应用完全关闭时只剩这条 cron 能把错过窗口的提醒补发出去（服务端支持 24h 内重试）。
on:
  schedule:
    # 每 15 分钟一次；GitHub Actions 的 schedule 使用 UTC
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # 手动触发入口，部署后可用来验证配置

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # P2-01：缺配置或接口异常必须红（告警），不允许静默跳过
    timeout-minutes: 2
    steps:
      - name: Verify configuration
        run: |
          if [ -z "${{ vars.TASK_REMINDER_BASE_URL }}" ]; then
            echo "::error::TASK_REMINDER_BASE_URL 未配置——提醒调度不会运行。请在 repo variables 配置后手动触发本工作流验证。"
            exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET 未配置——提醒接口会返回 401。"
            exit 1
          fi

      - name: Dispatch reminder delivery
        run: |
          http_code=$(curl -sS -o /tmp/reminder-response.json -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.TASK_REMINDER_BASE_URL }}/api/cron/task-reminders")
          echo "HTTP ${http_code}"
          cat /tmp/reminder-response.json
          echo
          test "$http_code" = "200"

      - name: Alert if deliveries stalled
        run: |
          python3 - <<'PY'
          import json, sys, datetime
          with open("/tmp/reminder-response.json") as f:
              body = json.load(f)
          last_sent_at = body.get("lastSentAt")
          if not last_sent_at:
              print("尚未有过成功投递（新环境正常；若已长期上线则视为停摆）")
              sys.exit(0)
          last = datetime.datetime.fromisoformat(last_sent_at.replace("Z", "+00:00"))
          age_hours = (datetime.datetime.now(datetime.timezone.utc) - last).total_seconds() / 3600
          print(f"lastSentAt={last_sent_at}（{age_hours:.1f} 小时前）")
          if age_hours > 48:
              print("::error::提醒投递已超过 48 小时没有任何成功记录——检查部署环境（Web Push 配置/到期任务/订阅状态）")
              sys.exit(1)
          PY
