name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - uses: actions/setup-node@v4
        # 与 .nvmrc / engines 对齐：Node 22 LTS
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # P0-01 安全门禁：生产依赖出现 Critical/High 漏洞时直接失败
      - name: Audit production dependencies (Critical/High)
        run: corepack pnpm audit --prod --audit-level high

      # P2-01 零警告门禁：任何新 lint 警告直接红灯
      - name: Lint (apps/web, zero warnings)
        working-directory: apps/web
        run: npx next lint --dir lib --dir components --dir app --max-warnings 0

      - name: Typecheck (apps/web)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Test (apps/web)
        working-directory: apps/web
        run: npx vitest run

      - name: Build (apps/web)
        working-directory: apps/web
        # build 时 prerender 静态页要创建 Supabase client，需要这两个 PUBLIC env 存在
        # （值不需要有效，仅满足 build；运行时由各环境自己的 .env 提供）
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        run: npx next build

  # P2-01 核心链路 smoke：mock 后端 + Chromium
  # 覆盖：登录、稍后读保存、笔记保存后刷新、任务完成、备份恢复（导出→空账户恢复）
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build (mock backend)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        run: npx next build

      - name: Run Playwright smoke
        working-directory: apps/web
        env:
          CI: "true"
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  db-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # 启动本地 Postgres 并应用所有迁移（pgTAP 测试只依赖 DB，不需要 auth/realtime）
      - name: Start local database
        run: supabase db start

      - name: Run database tests (pgTAP)
        run: supabase test db
