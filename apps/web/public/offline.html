<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>离线 - Cairn</title>
    <script>
      try {
        var savedTheme = localStorage.getItem('organize-theme');
        document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : 'system';
      } catch (_) {}
    </script>
    <style>
      :root { color-scheme: light; --page: #fff; --text: #202020; --secondary: #666; --button: #202020; --on-button: #fff; }
      :root[data-theme="dark"] { color-scheme: dark; --page: #191919; --text: #eee; --secondary: #a3a3a3; --button: #eee; --on-button: #191919; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { color-scheme: dark; --page: #191919; --text: #eee; --secondary: #a3a3a3; --button: #eee; --on-button: #191919; }
      }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: var(--page); color: var(--text); }
      .card { max-width: 26rem; padding: 24px; text-align: center; }
      h1 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0 0 12px; }
      p { color: var(--secondary); margin: 0 0 24px; }
      button { font: inherit; min-height: 44px; padding: 8px 20px; border-radius: 8px; border: 0; background: var(--button); color: var(--on-button); cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>当前处于离线状态</h1>
      <p>
        网络不可用，且这个页面没有离线缓存。此前访问过的页面在离线时仍可以打开；
        网络恢复后刷新即可回到完整功能。
      </p>
      <button onclick="location.reload()">重试</button>
    </main>
  </body>
</html>
