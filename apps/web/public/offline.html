<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>离线 - Organize</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #f8f8f7;
        color: #26251f;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1b1b18; color: #ecebe6; }
        button { border-color: #3d3d38; }
      }
      .card {
        max-width: 26rem;
        margin: 1rem;
        padding: 2rem;
        text-align: center;
        border: 1px solid #e4e3de;
        border-radius: 12px;
        background: inherit;
      }
      h1 { font-size: 1.125rem; margin: 0 0 0.75rem; }
      p { font-size: 0.875rem; line-height: 1.6; opacity: 0.75; margin: 0 0 1.5rem; }
      button {
        font: inherit;
        font-size: 0.875rem;
        padding: 0.5rem 1.25rem;
        border-radius: 8px;
        border: 1px solid #d8d7d0;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:hover { background: rgba(127, 127, 127, 0.1); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>当前处于离线状态</h1>
      <p>
        网络不可用，且这个页面没有离线缓存。此前访问过的页面在离线时仍可以打开；
        网络恢复后刷新即可回到完整功能。
      </p>
      <button onclick="location.reload()">重试</button>
    </main>
  </body>
</html>
