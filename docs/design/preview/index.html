<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cairn · 设计预览</title><link rel="stylesheet" href="styles.css"></head>
<body><a class="skip" href="#main">跳到主要内容</a>
<header class="preview-bar"><div class="preview-label"><strong>Cairn</strong><span>设计预览</span><span class="preview-note">演示资料仅存此浏览器，不连接真实账号</span></div><div class="preview-tools"><label>主题<select id="theme-select" aria-label="预览主题"><option value="light">浅色</option><option value="dark">暗色</option><option value="system">跟随系统</option></select></label><button id="device-toggle" aria-pressed="false">手机宽度</button><label>状态<select id="state-select" aria-label="预览状态"><option value="normal">正常</option><option value="offline">离线</option><option value="readonly">只读</option><option value="conflict">保存冲突</option><option value="error">加载失败</option><option value="empty">空内容</option></select></label></div></header>
<div id="shell" class="shell"><aside id="sidebar" class="sidebar" aria-label="主导航"></aside><button class="drawer-mask" id="drawer-mask" aria-label="关闭导航"></button><section class="workspace"><header id="topbar" class="topbar"></header><div id="state-banner"></div><main id="main" tabindex="-1"></main><nav id="bottom-nav" class="bottom-nav" aria-label="阅读与编辑工具"></nav></section></div>
<dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
